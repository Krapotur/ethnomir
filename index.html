<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ethnomir">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ethnomir</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
   <script>
    // Предотвращаем навигацию жестами
    history.pushState(null, null, location.href);
    window.onpopstate = function(event) {
      history.go(1); // Всегда остаемся на текущей странице
    };

    // Блокировка жестов свайпа
    document.addEventListener('touchstart', handleTouchStart, {passive: false});
    document.addEventListener('touchmove', handleTouchMove, {passive: false});
    
    let xDown = null;
    let yDown = null;

    function handleTouchStart(evt) {
      xDown = evt.touches[0].clientX;
      yDown = evt.touches[0].clientY;
    }

    function handleTouchMove(evt) {
      if (!xDown || !yDown) return;
      
      const xUp = evt.touches[0].clientX;
      const yUp = evt.touches[0].clientY;
      
      const xDiff = xDown - xUp;
      const yDiff = yDown - yUp;
      
      // Блокируем горизонтальные свайпы у краев экрана
      const edgeThreshold = 50;
      const isNearLeftEdge = xDown < edgeThreshold;
      const isNearRightEdge = xDown > window.innerWidth - edgeThreshold;
      
      if ((isNearLeftEdge || isNearRightEdge) && Math.abs(xDiff) > Math.abs(yDiff)) {
        // Горизонтальный свайп у края экрана - блокируем
        evt.preventDefault();
        evt.stopPropagation();
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
