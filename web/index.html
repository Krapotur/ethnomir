<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ethnomir">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ethnomir</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
   <script>
    // === ПОЛНАЯ БЛОКИРОВКА СВАЙПОВ БРАУЗЕРА ===
    
    // 1. Блокировка навигации через историю
    (function() {
      // Добавляем текущую страницу в историю
      history.pushState(null, null, location.href);
      
      // Блокируем кнопку "назад" браузера
      window.onpopstate = function(event) {
        // Всегда возвращаемся на текущую страницу
        history.go(1);
        
        // Можно показать уведомление
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('showToast', 'Навигация заблокирована');
        }
      };
    })();
    
    // 2. Блокировка жестов свайпа
    document.addEventListener('DOMContentLoaded', function() {
      let touchStartX = 0;
      let touchStartY = 0;
      const edgeThreshold = 30; // Пиксели от края для блокировки
      const minSwipeDistance = 20; // Минимальное расстояние свайпа
      
      // Начало касания
      document.addEventListener('touchstart', function(e) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        
        // Блокируем мультитач и масштабирование
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      
      // Движение пальцем
      document.addEventListener('touchmove', function(e) {
        const touchX = e.touches[0].clientX;
        const touchY = e.touches[0].clientY;
        
        const deltaX = touchX - touchStartX;
        const deltaY = touchY - touchStartY;
        
        // Определяем, начинается ли свайп у края экрана
        const isNearLeftEdge = touchStartX < edgeThreshold;
        const isNearRightEdge = touchStartX > window.innerWidth - edgeThreshold;
        
        // Если горизонтальный свайп у края экрана - блокируем
        if ((isNearLeftEdge || isNearRightEdge) && 
            Math.abs(deltaX) > Math.abs(deltaY) && 
            Math.abs(deltaX) > minSwipeDistance) {
          e.preventDefault();
          e.stopPropagation();
          
          // Вибрация (если поддерживается)
          if (navigator.vibrate) {
            navigator.vibrate(50);
          }
        }
      }, { passive: false });
      
      // Блокировка контекстного меню (долгое нажатие)
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });
    });
    
    // 3. Блокировка клавиш навигации (Alt+Left/Right, Backspace)
    document.addEventListener('keydown', function(e) {
      // Блокировка Alt+Left (назад) и Alt+Right (вперед)
      if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        e.preventDefault();
        e.stopPropagation();
      }
      
      // Блокировка Backspace для навигации назад
      if (e.key === 'Backspace' && e.target === document.body) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
